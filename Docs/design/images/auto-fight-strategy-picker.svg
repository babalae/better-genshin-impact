  <text x="754" y="257" fill="#dddddd" font-size="13">全部文本策略</text>
  <text x="1098" y="257" fill="#9a9a9a" font-size="12" text-anchor="end">128</text>
  <rect x="744" y="270" width="364" height="28" rx="4" fill="#3a3f4b"/>
  <text x="754" y="289" fill="#7fb0ff" font-size="12">✓</text>
  <text x="770" y="289" fill="#ffffff" font-size="13">📁 深渊</text>
  <text x="1098" y="289" fill="#9a9a9a" font-size="12" text-anchor="end">24</text>
  <text x="770" y="321" fill="#dddddd" font-size="13">📁 地图追踪</text>
  <text x="1098" y="321" fill="#9a9a9a" font-size="12" text-anchor="end">61</text>
  <text x="770" y="349" fill="#dddddd" font-size="13">📁 秘境</text>
  <text x="1098" y="349" fill="#9a9a9a" font-size="12" text-anchor="end">9</text>
  <text x="746" y="382" fill="#6a6a6a" font-size="11">选中子目录写入 auto:子目录，只在该目录内按队伍匹配</text>
  <text x="746" y="414" fill="#d9a54a" font-size="12">⚠ 3 个文本策略解析失败，匹配时会被跳过  查看 ›</text>
  <!-- 底栏 -->
  <line x1="580" y1="508" x2="1120" y2="508" stroke="#3a3a3a"/>
  <text x="600" y="537" fill="#dddddd" font-size="12">📁 打开目录</text>
  <text x="700" y="537" fill="#dddddd" font-size="12">📦 脚本仓库</text>
