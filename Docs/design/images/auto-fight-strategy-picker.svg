  <text x="140" y="537" fill="#dddddd" font-size="12">📦 脚本仓库</text>

  <!-- ===== 弹出层 B：自动 · 按队伍匹配 ===== -->
  <text x="580" y="106" fill="#cfcfcf" font-size="12">弹出层 B：自动选择 › 按队伍匹配</text>
  <rect x="580" y="116" width="540" height="440" rx="8" fill="#2a2a2a" stroke="#4a4a4a"/>
  <!-- 左栏 -->
  <text x="594" y="142" fill="#8a8a8a" font-size="11">自动选择</text>
  <rect x="588" y="152" width="136" height="26" rx="4" fill="#3a3f4b"/>
  <rect x="588" y="157" width="3" height="16" rx="1.5" fill="#7fb0ff"/>
  <text x="604" y="170" fill="#ffffff" font-size="13">按队伍匹配</text>
  <text x="604" y="198" fill="#dddddd" font-size="13">自动连招（实验）</text>
  <text x="594" y="232" fill="#8a8a8a" font-size="11">手动指定</text>
  <text x="604" y="260" fill="#dddddd" font-size="13">文本策略</text>
  <text x="716" y="260" fill="#9a9a9a" font-size="11" text-anchor="end">128</text>
  <text x="604" y="288" fill="#dddddd" font-size="13">JSON 策略</text>
  <text x="716" y="288" fill="#9a9a9a" font-size="11" text-anchor="end">6</text>
  <text x="604" y="316" fill="#dddddd" font-size="13">键鼠录制</text>
  <text x="716" y="316" fill="#9a9a9a" font-size="11" text-anchor="end">23</text>
