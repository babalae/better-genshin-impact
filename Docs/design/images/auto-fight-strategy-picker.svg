  <!-- 手动 -->
  <rect x="300" y="24" width="260" height="32" rx="4" fill="#323232" stroke="#4a4a4a"/>
  <rect x="308" y="31" width="30" height="18" rx="3" fill="#2d5a3d"/>
  <text x="315" y="44" fill="#9ee6b3" font-size="11">txt</text>
  <text x="346" y="45" font-size="13"><tspan fill="#9a9a9a">深渊 / </tspan><tspan fill="#ffffff">12-3上</tspan></text>
  <text x="542" y="45" fill="#bbbbbb" font-size="11">▾</text>
  <text x="300" y="76" fill="#8a8a8a" font-size="11">手动：实底类型标签，目录部分次要色</text>

  <!-- 失效 -->
