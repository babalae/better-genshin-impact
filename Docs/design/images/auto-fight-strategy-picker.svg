<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="580" viewBox="0 0 1140 580" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="1140" height="580" fill="#1c1c1c"/>

  <!-- ===== 触发区四种状态 ===== -->
  <!-- 自动 -->
  <rect x="20" y="24" width="260" height="32" rx="4" fill="#323232" stroke="#4a4a4a"/>
  <rect x="28" y="31" width="38" height="18" rx="9" fill="none" stroke="#7fb0ff"/>
