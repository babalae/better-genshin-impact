  <line x1="184" y1="192" x2="548" y2="192" stroke="#3a3a3a"/>
  <text x="192" y="216" fill="#ffffff" font-size="13">📁 上半</text>
  <text x="540" y="216" fill="#9a9a9a" font-size="12" text-anchor="end">8  ›</text>
  <text x="192" y="244" fill="#ffffff" font-size="13">📁 下半</text>
  <text x="540" y="244" fill="#9a9a9a" font-size="12" text-anchor="end">6  ›</text>
  <rect x="184" y="256" width="364" height="44" rx="4" fill="#3a3f4b"/>
  <text x="192" y="274" fill="#7fb0ff" font-size="12">✓</text>
  <text x="208" y="274" fill="#ffffff" font-size="13">钟离万叶班尼特香菱</text>
  <text x="540" y="274" fill="#9ee6b3" font-size="11" text-anchor="end">txt</text>
  <text x="208" y="292" fill="#9a9a9a" font-size="11">钟离 · 万叶 · 班尼特 · 香菱</text>
  <text x="208" y="322" fill="#ffffff" font-size="13">那维莱特-芙宁娜</text>
  <text x="540" y="322" fill="#9ee6b3" font-size="11" text-anchor="end">txt</text>
  <text x="208" y="340" fill="#9a9a9a" font-size="11">那维莱特 · 芙宁娜 · 万叶 · 白术</text>
  <text x="208" y="370" fill="#ffffff" font-size="13">旧版雷国</text>
  <rect x="482" y="358" width="58" height="18" rx="3" fill="#6a4f14"/>
  <text x="511" y="371" fill="#ffd27a" font-size="11" text-anchor="middle">解析失败</text>
  <text x="208" y="388" fill="#d9a54a" font-size="11">第 3 行：未知指令 aim</text>
  <text x="366" y="440" fill="#6a6a6a" font-size="11" text-anchor="middle">虚拟化列表 · 副标题后台加载</text>
  <!-- 底栏 -->
  <line x1="20" y1="508" x2="560" y2="508" stroke="#3a3a3a"/>
