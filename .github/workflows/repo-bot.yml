name: Repo Bot
run-name: "Repo Bot #${{ github.event.issue.number || github.event.pull_request.number }} - ${{ github.event_name }}/${{ github.event.action }} - @${{ github.actor }}"

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  issue_comment:
    types:
      - created
      - edited
  # pull_request_target (not pull_request) is required so that pull requests opened from
  # forks can be labelled/commented. Never check out or execute the pull request head here.
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

jobs:
  repo-bot:
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        github.event_name != 'issue_comment' ||
        contains(github.event.comment.body, '/fix') ||
        contains(github.event.comment.body, '/refresh')
      )
    uses: ddaodan/bettergi-github-bot/.github/workflows/repo-bot.yml@v1
    permissions:
      issues: write
      pull-requests: write
      contents: read
    secrets:
      REPO_BOT_AI_API_KEY: ${{ secrets.REPO_BOT_AI_API_KEY }}
      REPO_BOT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.REPO_BOT_GITHUB_APP_PRIVATE_KEY }}
    with:
      config-path: .github/repo-bot.yml
      # pull_request_target: only fetch the configuration from the base branch.
      # Never check out the pull request head (it would execute untrusted code).
      checkout-mode: config-only
      config-overrides-json: ${{ vars.REPO_BOT_CONFIG_OVERRIDES_JSON }}
      ai-enabled: ${{ vars.REPO_BOT_AI_ENABLED }}
      ai-base-url: ${{ vars.REPO_BOT_AI_BASE_URL }}
      ai-model: ${{ vars.REPO_BOT_AI_MODEL }}
      ai-api-style: ${{ vars.REPO_BOT_AI_API_STYLE }}
      ai-timeout-ms: ${{ vars.REPO_BOT_AI_TIMEOUT_MS }}
      action-ref: v1
      github-app-id: ${{ vars.REPO_BOT_GITHUB_APP_ID }}